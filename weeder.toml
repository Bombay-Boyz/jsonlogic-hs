# Dead-code detection (Standard 1.11). A definition is live if it can be
# reached from the public JsonLogic module, from a test or benchmark or
# other executable's main, or from an instance. Everything else, including
# an export of a JsonLogic.Core.* module that nothing uses, is reported.
roots = [ "^Main\\.main$", "^JsonLogic\\.[^.]+$" ]
type-class-roots = true
