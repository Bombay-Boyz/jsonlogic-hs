name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (GHC ${{ matrix.ghc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.6.7", "9.8.4", "9.10.3", "9.12.4", "9.14.1"]
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      # Warnings are errors on the primary compiler only: other GHCs add and
      # remove warnings, and that must not fail the build there.
      - name: Relax -Werror off the primary GHC
        if: matrix.ghc != '9.14.1'
        run: |
           printf 'package jsonlogic-hs\n  flags: -werror +differential\n' > cabal.project.local

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - run: cabal update
      - run: cabal build all
      - run: cabal test all --test-show-details=direct

      - name: cabal check
        if: matrix.ghc == '9.14.1'
        run: cabal check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/lint.sh

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14.1"
          cabal-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.14.1-diff-${{ hashFiles('**/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.14.1-diff-

      - run: cd differential && npm install --no-audit --no-fund
      - run: cabal update
      - run: cabal run jsonlogic-hs-differential -- 5000 1
